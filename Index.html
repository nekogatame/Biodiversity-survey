<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名護市の農場で見つけた生き物図鑑</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.8;
            background: #f7f7f2;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .creature {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .creature img {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: 0 auto 20px;
            border-radius: 8px;
        }

        .creature h2 {
            margin-top: 10px;
        }

        .info {
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>

<body>

    <h1>名護市の農場で見つけた生き物図鑑</h1>

    <p class="subtitle">
        沖縄県名護市の農場で出会った生き物を記録しています。
    </p>

    <section class="creature">

        <img src="shirikenimori-01.jpg" alt="シリケンイモリ">

        <h2>シリケンイモリ</h2>

        <div class="info">
            <p><strong>分類：</strong>両生類・イモリ科</p>

            <p><strong>確認場所：</strong>沖縄県名護市の農場</p>

            <p><strong>観察記録：</strong><br>
            農場内で確認したシリケンイモリです。
            </p>
        </div>

    </section>

    <footer>
        ドリームガーデン名護　農場生きもの図鑑
    </footer>

</body>
</html>
